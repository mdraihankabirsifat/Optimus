# Render Blueprint for the Escave dedicated server.
# Render builds the Dockerfile at the repository root and routes public HTTPS/WSS traffic
# to the port it passes in PORT. Players connect to wss://<service-name>.onrender.com.
# Nothing here is secret. See docs/NETWORKING.md for the step-by-step deployment.
services:
  - type: web
    name: escave-server
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: true
